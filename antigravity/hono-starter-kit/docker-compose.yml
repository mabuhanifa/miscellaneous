version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/hono-starter
      - JWT_SECRET=dev_secret
      - JWT_REFRESH_SECRET=dev_refresh_secret
      - LOG_LEVEL=debug
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm dev

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
